  .btn-primary {
    background: linear-gradient(135deg, #54B98A, #2E8F63); color: #FFFFFF;
    margin-bottom: 10px;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(46,143,99,0.4); }
  .btn-ghost {
    display: flex; justify-content: center; width: 100%;
    border: 1px solid #8FD1AE; background: rgba(67,168,122,0.08);
    color: #1E6B48;
  }
  .btn-ghost:hover { background: rgba(67,168,122,0.18); transform: translateY(-2px); }
